version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
